agents:
  queue: clima
steps:

  - group: "CUDA/MPI Tests"
    key: "cuda-mpi-tests"
    steps:
      - label: "CUDA/MPI test on derecho"
        command:
          - julia --project=.buildkite -e 'using Pkg; Pkg.instantiate()'
          - mpiwrapperexec -n 2 set_gpu_rank nsys profile --trace=cuda --output=report_%q{PMI_RANK} --force-overwrite true julia --project=.buildkite .buildkite/test_cuda_mpi.jl
          - nsys stats --report cuda_gpu_trace report_0.nsys-rep --force-export true
          - nsys stats --report cuda_gpu_trace report_0.nsys-rep --force-export true | grep -E "memcpy (Peer-to-Peer|PtoP)"
        agents:
          queue: derecho
          pbs_l_select: "1:ngpus=2:ncpus=64"
          pbs_l_walltime: "00:10:00"
          pbs_q: develop
          modules: climacommon/2025_02_25
        soft_fail: true

      - label: "CUDA/MPI test on clima"
        command:
          - julia --project=.buildkite -e 'using Pkg; Pkg.instantiate()'
          - srun nsys profile --trace=cuda --output=report_%q{SLURM_PROCID} --force-overwrite true julia --project=.buildkite .buildkite/test_cuda_mpi.jl
          - nsys stats --report cuda_gpu_trace report_0.nsys-rep --force-export true
          - nsys stats --report cuda_gpu_trace report_0.nsys-rep --force-export true | grep -E "memcpy (Peer-to-Peer|PtoP)"
        agents:
          queue: clima
          slurm_ntasks: 2
          slurm_gpus_per_task: 1
          slurm_cpus_per_task: 4
          slurm_time: "00:10:00"
          modules: climacommon/2026_11_06-1.13.3

      - label: "CUDA/MPI test on central"
        command:
          - julia --project=.buildkite -e 'using Pkg; Pkg.instantiate(); Pkg.precompile()'
          - srun julia --project=.buildkite .buildkite/test_cuda_mpi.jl
        agents:
          queue: central
          slurm_nodes: 2
          slurm_ntasks_per_node: 1
          slurm_gpus_per_task: 1
          slurm_cpus_per_task: 8
          slurm_time: "00:45:00"
          modules: climacommon/2026_10_30-1.13.3

  - group: "chainrun Tests"
    key: "chainrun-tests"
    steps:
      - label: "chainrun test on derecho"
        command:
          - python3 -m unittest tests/test_chainrun.py
          - python3 tests/live_chainrun.py --dir /glade/derecho/scratch/$$USER
        agents:
          queue: derecho
          pbs_q: develop
          pbs_l_select: "1:ncpus=1"
          pbs_l_walltime: "01:00:00"
          modules: climacommon/2025_02_25

      - label: "chainrun test on clima"
        command:
          - python3 -m unittest tests/test_chainrun.py
          - python3 tests/live_chainrun.py
        agents:
          queue: clima
          slurm_time: "01:00:00"
          modules: climacommon/2026_11_06-1.13.3
